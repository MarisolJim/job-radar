# Rules that turn every company's full posting list into YOUR shortlist.
# A job is kept only if it passes all the rules below. Leave a list empty ([])
# to disable that rule. Matching is case-insensitive substring matching.

# Keep only titles containing at least one of these (new-grad SWE focused):
title_include:
  - software engineer
  - software developer
  - new grad
  - new graduate
  - university grad
  - early career
  - associate engineer
  - "engineer i"
  - "engineer 1"

# Drop titles containing any of these (senior/lead/manager/etc.):
title_exclude:
  - senior
  - staff
  - principal
  - lead
  - manager
  - director
  - "ii"
  - "iii"
  - intern          # remove this line if you also want internships
  - phd

# Keep only these locations (leave empty to allow all):
location_include: []

# Drop these locations:
location_exclude: []

# Set true to keep only remote roles:
remote_only: false

# US-only filter. Drops postings whose location is clearly outside the US
# (Canada, UK, India, EMEA/APAC, etc.). Uses smart detection of US states,
# "United States/USA", and remote-US phrasing — not just keyword matching.
us_only: true

# When us_only is on: keep postings with an ambiguous location (a bare "Remote"
# with no country) so a likely US remote role isn't dropped. Set false to be
# strict and require an explicit US signal.
keep_ambiguous_location: true
