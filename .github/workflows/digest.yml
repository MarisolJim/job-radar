name: Daily digest

on:
  schedule:
    # 13:00 UTC daily. Adjust to your timezone (e.g. 13:00 UTC = 6am PT / 9am ET).
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Read-only restore of the state the poll workflow maintains in the cache.
      - name: Restore seen-jobs state
        uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python src/main.py digest --hours 24
