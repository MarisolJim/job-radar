name: Poll jobs (be first)

on:
  schedule:
    # Every 15 minutes. Public repo = unlimited free Actions minutes. GitHub's
    # scheduled-run floor is 5 min, and runs can still be delayed under load.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Serialize runs so the cached state file is never updated by two runs at once.
concurrency:
  group: job-radar-poll
  cancel-in-progress: false

# No repo writes needed any more — state lives in the Actions cache, not git.
permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Restore the seen-jobs state from the cache. A unique key per run means
      # the post-job step always saves a fresh snapshot; restore-keys pulls the
      # most recent previous one. (Caches unused for 7 days are evicted, which
      # would just cause one "everything is new" run — harmless.)
      - name: Restore seen-jobs state
        uses: actions/cache@v4
        with:
          path: data/seen.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll and alert
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python src/main.py poll
